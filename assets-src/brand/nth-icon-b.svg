<?xml version="1.0" encoding="UTF-8"?>
<!-- OD-0136: the locked nth icon B "Exponent" (master). Copied from work/design/nth-brand/nth-brand.html <defs>, with the
     page's colour tokens written out (brand metal is fixed in both themes). Shows mkB; mkBs is the 16-24 px cut, trB the
     one-colour 16 px tray mark. scripts/brand/NthIcon renders the shipped icon files from the same geometry. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="gTile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14161c"/><stop offset=".55" stop-color="#3b414f"/><stop offset="1" stop-color="#9aa3b5"/></linearGradient>
    <radialGradient id="gPool" cx=".82" cy=".95" r=".6"><stop offset="0" stop-color="#d6dae2" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="gHi" x1=".25" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".42" stop-color="#ffffff" stop-opacity=".08"/><stop offset=".6" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="gGlyph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e8ebf0"/><stop offset="1" stop-color="#b9c0cd"/></linearGradient>
    <radialGradient id="gBead" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d6dae2"/><stop offset="1" stop-color="#9aa3b5"/></radialGradient>
    <filter id="fG" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#06080c" flood-opacity=".38"/></filter>
    <symbol id="tile" viewBox="0 0 256 256">
      <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#gTile)"/>
      <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#gPool)"/>
      <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#gHi)"/>
      <rect x="9" y="9" width="238" height="238" rx="51" fill="none" stroke-width="2" stroke="#ffffff" stroke-opacity=".38"/>
    </symbol>
    <symbol id="mkB" viewBox="0 0 256 256"><use href="#tile" xlink:href="#tile"/>
      <g filter="url(#fG)"><path d="M70 196V124a44 44 0 0 1 88 0v72" fill="none" stroke="url(#gGlyph)" stroke-width="26"/><circle cx="186" cy="74" r="14" fill="url(#gBead)"/></g></symbol>
    <symbol id="mkBs" viewBox="0 0 256 256"><use href="#tile" xlink:href="#tile"/>
      <g><path d="M66 200V126a48 48 0 0 1 96 0v74" fill="none" stroke="url(#gGlyph)" stroke-width="36"/><circle cx="194" cy="68" r="20" fill="url(#gBead)"/></g></symbol>
    <symbol id="trB" viewBox="0 0 16 16"><path d="M3.3 13.4V8.4a3.1 3.1 0 0 1 6.2 0v5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12.4" cy="4" r="1.6" fill="currentColor"/></symbol>
  </defs>
  <use href="#mkB" xlink:href="#mkB" width="256" height="256"/>
</svg>
