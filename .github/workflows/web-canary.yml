# Web surfaces W23 (DESIGN 8.1 and 14): the weekly WebView2 Canary job.
#
# The Evergreen WebView2 runtime updates itself about every two weeks, and nth cannot pin it. Microsoft's guidance for Evergreen apps is
# to test regularly against a preview channel, and Canary is the recommended one (it ships the fastest and has the newest APIs). This
# job installs Edge Canary on a clean Windows runner, points the WebView2 loader at it, and runs the web tests that touch the real engine
# (the tests named *Native* under a Web namespace), so a change in the engine shows up here before it reaches users.
#
# Written, not run (the owner's decision C: CI jobs and clean-VM installs are written first and run by the lead). Nothing in this file
# publishes, signs, releases or pushes anything. The one write it makes is an issue in this repository when the Canary run fails.
#
# Channel selection is by environment variable (Microsoft: "Switching the channel search order"):
#   WEBVIEW2_CHANNEL_SEARCH_KIND = 1  search from the least stable channel to the most stable
#   WEBVIEW2_RELEASE_CHANNELS    = 3  consider Canary only (Stable 0, Beta 1, Dev 2, Canary 3)
# A hosted runner has no Evergreen runtime pinned by us, so the first (baseline) step also records which stable runtime it ran against.
name: WebView2 Canary

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: web-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned .NET SDK (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the test projects (locked restore)
        shell: pwsh
        run: |
          # The runner context is not available in a job's env, so the data folder is handed to the later steps through GITHUB_ENV.
          $dataDir = Join-Path $env:RUNNER_TEMP 'nth-canary-data'
          "MARROW_PORT_DATA_DIR=$dataDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $projects = Get-ChildItem tests -Directory -Filter 'Marrow.*.Tests' | ForEach-Object { Join-Path $_.FullName "$($_.Name).csproj" } | Where-Object { Test-Path $_ }
          foreach ($project in $projects) {
            dotnet build $project -c Release --nologo -v q
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }

      - name: Baseline - the web tests that need no engine, on the stable runtime
        shell: pwsh
        run: |
          # If this fails the Canary result below is not about Canary: fix the baseline first.
          $projects = Get-ChildItem tests -Directory -Filter 'Marrow.*.Tests' | ForEach-Object { Join-Path $_.FullName "$($_.Name).csproj" } | Where-Object { Test-Path $_ }
          foreach ($project in $projects) {
            dotnet test $project -c Release --no-build --nologo --filter 'FullyQualifiedName~Web&FullyQualifiedName!~Native' --logger "trx;LogFileName=baseline-$((Split-Path $project -LeafBase)).trx" --results-directory "$env:RUNNER_TEMP\results"
            if ($LASTEXITCODE -ne 0) { throw "Baseline web tests failed: $project" }
          }

      - name: Install Edge Canary (the WebView2 preview channel)
        id: canary
        shell: pwsh
        run: scripts/ci/Install-EdgeCanary.ps1

      - name: Canary - the web tests that start the real engine
        shell: pwsh
        env:
          WEBVIEW2_CHANNEL_SEARCH_KIND: '1'
          WEBVIEW2_RELEASE_CHANNELS: '3'
        run: |
          Write-Host "Edge Canary ${{ steps.canary.outputs.canary-version }}"
          $projects = Get-ChildItem tests -Directory -Filter 'Marrow.*.Tests' | ForEach-Object { Join-Path $_.FullName "$($_.Name).csproj" } | Where-Object { Test-Path $_ }
          $failed = @()
          foreach ($project in $projects) {
            dotnet test $project -c Release --no-build --nologo --filter 'FullyQualifiedName~Web&FullyQualifiedName~Native' --logger "trx;LogFileName=canary-$((Split-Path $project -LeafBase)).trx" --results-directory "$env:RUNNER_TEMP\results"
            if ($LASTEXITCODE -ne 0) { $failed += $project }
          }
          if ($failed.Count -gt 0) { throw "Canary web tests failed: $($failed -join ', ')" }

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-canary-results
          path: ${{ runner.temp }}\results
          if-no-files-found: ignore

      - name: Tell the owner (an issue, once, with the run's link)
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = "The weekly WebView2 Canary run failed (Edge Canary ${{ steps.canary.outputs.canary-version }}). Run: $run`n`nIf the baseline step passed, the engine changed under us; read the Canary step's log and the attached TRX."
          gh label create web-canary --description 'Weekly WebView2 Canary run' --force
          $open = gh issue list --label web-canary --state open --json number --jq '.[0].number'
          if ($open) { gh issue comment $open --body $body } else { gh issue create --label web-canary --title 'WebView2 Canary: the web tests failed' --body $body }
